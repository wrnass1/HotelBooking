# Local administration and the existing pg_cron jobs.
local all all trust
host all all 127.0.0.1/32 scram-sha-256
host all all ::1/128 scram-sha-256
# Physical replication has its own role and protocol/database selector.
host replication hotelbooking_replicator samenet scram-sha-256
# Connections from the Compose network, including API and Liquibase.
host all all all scram-sha-256
